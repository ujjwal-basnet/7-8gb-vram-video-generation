[project]
name = "vram-video-generation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchaudio==2.8.0",
  "diffsynth==2.1.8",
  "transformers==4.57.6",
  "bitsandbytes==0.50.2",
  "comfy-kitchen==0.2.37",
  "pydantic>=2,<3",
  "imageio-ffmpeg",
  "safetensors",
  "huggingface-hub==0.36.2",
  "soundfile",
  "av",
  "librosa",
  "einops==0.8.2",
]

[tool.uv.sources]
diffsynth = { git = "https://github.com/modelscope/DiffSynth-Studio.git", rev = "974cfa37f27ac55eba3b6d10efa21f876900572d" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
